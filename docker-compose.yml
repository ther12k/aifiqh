services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: aifiqh
      POSTGRES_PASSWORD: aifiqh
      POSTGRES_DB: aifiqh
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aifiqh -d aifiqh']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/aifiqh-originals &&
      mc anonymous set none local/aifiqh-originals &&
      echo 'bucket ready'"

  oidc:
    build: ./docker/oidc-provider
    environment:
      ISSUER: http://oidc:4011
      PORT: '4011'
      EXTRA_REDIRECT_URIS: http://localhost:${APP_PORT:-8080}/auth/callback
      # local-only plaintext credentials; production provisions
      # passwordScrypt hashes via the deployment override instead
      OIDC_ACCOUNTS: '[{"email":"admin@example.com","name":"Admin Alpha","password":"devpass-admin"},{"email":"editor@example.com","name":"Editor Alpha","password":"devpass-editor"},{"email":"reviewer@example.com","name":"Reviewer Alpha","password":"devpass-reviewer"},{"email":"reader@example.com","name":"Reader Alpha","password":"devpass-reader"}]'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      oidc:
        condition: service_started
    ports:
      - '${APP_PORT:-8080}:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://aifiqh:aifiqh@db:5432/aifiqh
      STORAGE_ENDPOINT: http://minio:9000
      OIDC_ISSUER: http://oidc:4011
      SESSION_SECRET: aifiqh-unified-single-port-secret-key-32chars
      WEB_DIST_PATH: /app/apps/web/dist
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8080}
      # email-only shortcut stays confined to local development; the OIDC
      # flow with credential accounts is always available
      AUTH_DEV_LOGIN_ENABLED: 'true'

volumes:
  db-data:
  minio-data:
