name: Migration rehearsal

# REL-HARD-001: keep the populated-database rehearsal running on a schedule
# so the upgrade path stays proven as new migrations land — not just as a
# one-off script. Also runs on demand.

on:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC
  workflow_dispatch:

jobs:
  rehearse:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create fresh rehearsal database
        run: |
          docker rm -f aifiqh-rehearsal-pg 2>/dev/null || true
          docker run -d --name aifiqh-rehearsal-pg \
            -e POSTGRES_USER=aifiqh -e POSTGRES_PASSWORD=aifiqh -e POSTGRES_DB=aifiqh \
            -p 127.0.0.1:15433:5432 pgvector/pgvector:0.8.0-pg16
          ready=0
          for i in $(seq 1 60); do
            if docker exec aifiqh-rehearsal-pg pg_isready -U aifiqh -d aifiqh >/dev/null 2>&1; then
              ready=$((ready+1)); [ "$ready" -ge 3 ] && break
            else
              ready=0
            fi
            sleep 1
          done
          [ "$ready" -ge 3 ] || { docker logs aifiqh-rehearsal-pg | tail -30; exit 1; }
          docker exec aifiqh-rehearsal-pg psql -U aifiqh -d postgres \
            -c "create database aifiqh_rehearsal"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run populated-database migration rehearsal
        run: bun scripts/rehearse_migration.ts "postgres://aifiqh:aifiqh@127.0.0.1:15433/aifiqh_rehearsal"

      - name: Stop rehearsal container
        if: always()
        run: docker rm -f aifiqh-rehearsal-pg
