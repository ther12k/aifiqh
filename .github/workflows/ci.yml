name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aifiqh
          POSTGRES_PASSWORD: aifiqh
          POSTGRES_DB: aifiqh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aifiqh"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://aifiqh:aifiqh@localhost:5432/aifiqh
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint (biome)
        run: bunx biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + DB integration)
        run: bun test

      - name: Build
        run: bun run build
