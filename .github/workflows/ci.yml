name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # self-hosted runner on the halotec server (GitHub-hosted runners are
    # unavailable: billing). The runner runs in a container with the host
    # docker socket mounted, so `services:` is not available; instead the
    # job starts its own disposable pgvector container (below).
    runs-on: self-hosted
    env:
      DATABASE_URL: postgres://aifiqh:aifiqh@127.0.0.1:15432/aifiqh
    steps:
      - uses: actions/checkout@v4

      - name: Start disposable pgvector container
        run: |
          docker rm -f aifiqh-ci-pg 2>/dev/null || true
          docker run -d --name aifiqh-ci-pg \
            -e POSTGRES_USER=aifiqh -e POSTGRES_PASSWORD=aifiqh -e POSTGRES_DB=aifiqh \
            -p 127.0.0.1:15432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            docker exec aifiqh-ci-pg pg_isready -U aifiqh -d aifiqh && break
            sleep 1
          done
          docker exec aifiqh-ci-pg pg_isready -U aifiqh -d aifiqh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint (biome)
        run: bunx biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + DB integration)
        run: bun test

      - name: Build
        run: bun run build

      - name: Stop pgvector container
        if: always()
        run: docker rm -f aifiqh-ci-pg
