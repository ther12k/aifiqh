name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # self-hosted runner on the halotec server (GitHub-hosted runners are
    # unavailable: billing). The runner runs in a container with the host
    # docker socket mounted, so `services:` is not available; instead the
    # job starts its own disposable pgvector container (below).
    runs-on: self-hosted
    env:
      DATABASE_URL: postgres://aifiqh:aifiqh@127.0.0.1:15432/aifiqh
    steps:
      - uses: actions/checkout@v4

      - name: Archive quarantine assertions
        run: |
          # no runtime package may import from the archived design artifact
          if grep -rn "docs/archive" apps packages; then
            echo "::error::runtime code references docs/archive"; exit 1
          fi
          # no migration may reference archived schemas
          if grep -rniE "\bokf\b" db/migrations; then
            echo "::error::migration references archived OKF schemas"; exit 1
          fi
          # no deploy artifact may copy the archive
          if grep -rn "docs/archive" docker Dockerfile* 2>/dev/null; then
            echo "::error::deployment copies archived material"; exit 1
          fi
          # the archive must announce itself as non-runtime
          head -5 docs/archive/okf-prototype/README.md | grep -q "Archived Design Artifact"

      - name: Start disposable MinIO container
        run: |
          docker rm -f aifiqh-ci-minio 2>/dev/null || true
          docker run -d --name aifiqh-ci-minio \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 127.0.0.1:19000:9000 minio/minio:RELEASE.2024-06-13T22-53-53Z server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:19000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:19000/minio/health/live
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2024-11-21T17-21-54Z \
            -c "mc alias set ci http://127.0.0.1:19000 minioadmin minioadmin && mc mb --ignore-existing ci/aifiqh-originals"

      - name: Start disposable pgvector container
        run: |
          docker rm -f aifiqh-ci-pg 2>/dev/null || true
          docker run -d --name aifiqh-ci-pg \
            -e POSTGRES_USER=aifiqh -e POSTGRES_PASSWORD=aifiqh -e POSTGRES_DB=aifiqh \
            -p 127.0.0.1:15432:5432 pgvector/pgvector:0.8.0-pg16
          # postgres entrypoint restarts once during first init; require
          # consecutive successes so the check cannot land in that window
          ready=0
          for i in $(seq 1 60); do
            if docker exec aifiqh-ci-pg pg_isready -U aifiqh -d aifiqh >/dev/null 2>&1; then
              ready=$((ready+1))
              [ "$ready" -ge 3 ] && break
            else
              ready=0
            fi
            sleep 1
          done
          [ "$ready" -ge 3 ] || { docker logs aifiqh-ci-pg | tail -30; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          # pinned: CI must not change behavior without a repo change
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bunx biome check .

      - name: RLS policy lint (advisory report)
        run: bun scripts/check_rls_policies.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + DB integration + storage)
        run: bun test
        env:
          STORAGE_ENDPOINT: http://127.0.0.1:19000

      - name: Build
        run: bun run build

      - name: Stop disposable containers
        if: always()
        run: docker rm -f aifiqh-ci-pg aifiqh-ci-minio
